name: gear-management
version: 2.0.0
description: 设备管理 — JSONB 灵活存储，AI 自由定义字段

tools:
  - name: gear_add
    handler: gear_add
    description: |
      添加设备记录。data 自由 JSON。

      参考字段（全部可选）：
        gear_type:       '相机' / '镜头' / '配件' / '冲扫设备' ...
        brand:           'Leica' / 'Nikon' / 'Canon' / 'Hasselblad' / 'Fujifilm' ...
        model:           'M6' / 'F3' / 'AE-1'
        nickname:        '小黑'（自定义昵称）
        serial_number:   'SN123456' / 'No.xxxx'
        category:        '主机' / '镜头' / '配件'
        condition:       '全新' / '95新' / '正常使用痕迹' / '战斗成色'
        status:          '在用' / '闲置' / '已出' / '维修中'（默认 '在用'）
        storage:         '防潮箱-A格' / '摄影包'
        camera_type:     '旁轴' / '单反' / '双反' / '中画幅' / '大画幅' / '傻瓜机'
        lens_mount:      'M口' / 'F口' / 'EF口' / 'E口' / 'PK口' / 'M42' / 'L39' ...
        format_support:  '135' / '120' / '4×5' / '全画幅' / 'APS-C' ...
        purchase:        {'date': '2026-01-15', 'price': 12000, 'channel': '闲鱼'}
        sell:            {'date': '2026-05-01', 'price': 11000}
        notes:           '测光略偏差，-0.5EV 补偿'
    parameters:
      - name: name
        type: string
        required: true
        description: 设备名称，如"Leica M6"、"尼康 50/1.4D"、"曼富图三脚架"
      - name: data
        type: object
        required: false
        description: |
          自由 JSON 数据。AI 根据对话决定字段。
          支持嵌套（purchase: {price, date, channel}）。
          不要存 name 和 entity_type。

  - name: gear_query
    handler: gear_query
    description: |
      查询设备。支持任意 JSON 字段过滤。

      示例：
        {"gear_type": "相机", "brand": "Leica"}
        {"status": "在用", "lens_mount": "M口"}
    parameters:
      - name: filters
        type: object
        required: false
        description: 过滤条件。键是 data 中的字段路径，值是精确匹配值。
      - name: limit
        type: integer
        required: false
        description: 返回条数，默认 50

  - name: gear_update
    handler: gear_update
    description: 修改设备记录。只传入需要更新的字段。
    parameters:
      - name: entity_id
        type: string
        required: true
        description: 要修改的实体 ID
      - name: data
        type: object
        required: false
        description: 要更新的字段（合并到现有 data）
      - name: name
        type: string
        required: false
        description: 新的名称（可选）

  - name: gear_delete
    handler: gear_delete
    description: 删除设备记录。必须先查询确认。
    parameters:
      - name: entity_id
        type: string
        required: true
        description: 要删除的实体 ID
      - name: confirmed
        type: boolean
        required: false
        description: 用户确认后才传 true

  - name: gear_search
    handler: gear_search
    description: |
      全文搜索设备。
      示例："Leica M口"、"Nikon F3 战斗"
    parameters:
      - name: query
        type: string
        required: true
        description: 搜索关键词
      - name: limit
        type: integer
        required: false
        description: 返回条数，默认 10

  - name: gear_stats
    handler: gear_stats
    description: 获取设备统计概览（总数、总价值）
    parameters: []
