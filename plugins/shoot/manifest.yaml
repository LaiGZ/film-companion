name: shoot-management
version: 1.0.0
description: 拍摄记录管理 — 记录每次拍摄活动、装卷事件、设备出勤

tools:
  - name: add_shoot
    handler: add_shoot
    description: 创建拍摄记录。当用户说"去了/拍了/去××拍了"时调用。
    parameters:
      - name: title
        type: string
        required: false
        description: 拍摄活动名称，如"京都红枫"、"故宫游记"。可自动从对话推断
      - name: shoot_date
        type: string
        required: false
        description: 拍摄日期，格式 YYYY-MM-DD。省略则默认为今天
      - name: location
        type: string
        required: false
        description: 拍摄地点，如"故宫博物院"、"颐和园"
      - name: description
        type: string
        required: false
        description: 拍摄笔记/描述
      - name: tags
        type: array
        items: string
        required: false
        description: 标签，如["街拍", "旅行", "人像"]
      - name: weather
        type: string
        required: false
        description: 天气，如"晴"、"多云"、"阴"

  - name: query_shoot
    handler: query_shoot
    description: 查询拍摄记录。当用户说"拍的怎么样/最近拍了什么/查一下××的拍摄"时调用。
    parameters:
      - name: location__like
        type: string
        required: false
        description: 地点模糊匹配
      - name: date_from
        type: string
        required: false
        description: 起始日期 YYYY-MM-DD
      - name: date_to
        type: string
        required: false
        description: 结束日期 YYYY-MM-DD
      - name: limit
        type: integer
        required: false
        description: 返回条数

  - name: load_film
    handler: load_film
    description: 记录装卷事件。当用户说"装了××卷到××相机"时调用。注意：装卷不扣库存。
    parameters:
      - name: film_name
        type: string
        required: true
        description: 胶卷名称，如"柯达金200"。系统会先查库存中是否有同名胶卷
      - name: camera_name
        type: string
        required: false
        description: 相机名称，如"尼康FE"。系统会从设备库中查找
      - name: iso_setting
        type: integer
        required: false
        description: 实际拨盘的 ISO 值（与胶卷标定 ISO 不同时为迫冲/减感）
      - name: push_pull
        type: integer
        required: false
        description: 迫冲档位，+1 迫冲一档，-1 减感一档，0 正常
      - name: shoot_title
        type: string
        required: false
        description: 关联的拍摄活动名称。如果存在匹配的 shoot 则自动关联

  - name: unload_film
    handler: unload_film
    description: 记录退卷事件。当用户说"退卷/拿出来了/换卷/拍到一半拿出来了"时调用。
    parameters:
      - name: film_name
        type: string
        required: true
        description: 退卷的胶卷名称
      - name: camera_name
        type: string
        required: false
        description: 从哪台相机退卷。省略则查该卷最近的在机内记录
      - name: frames_shot
        type: integer
        required: false
        description: 这次拍了多少张

  - name: finish_film
    handler: finish_film
    description: 标记胶卷已拍完。当用户说"拍完了/一卷拍完了/这卷拍完了"时调用。
    parameters:
      - name: film_name
        type: string
        required: true
        description: 拍完的胶卷名称
      - name: frames_shot
        type: integer
        required: false
        description: 最后一次拍了多少张
      - name: frames_total
        type: integer
        required: false
        description: 这卷总共拍了多少张。省略则自动累加 history

  - name: query_loading
    handler: query_loading
    description: 查询装卷状态。当用户说"相机里有什么卷/哪些卷还没拍完/机内有什么卷"时调用。
    parameters:
      - name: status
        type: string
        required: false
        enum: ["在机内", "已退卷", "已拍完"]
        description: 筛选状态，省略则查全部活跃状态
      - name: camera_name
        type: string
        required: false
        description: 按相机筛选
      - name: limit
        type: integer
        required: false
        description: 返回条数
