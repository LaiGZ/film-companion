name: shoot-management
version: 2.0.0
description: 拍摄记录管理 — 记录拍摄活动、装卷/退卷/拍完事件

tools:
  - name: shoot_add
    handler: shoot_add
    description: |
      创建拍摄记录。data 自由 JSON。

      参考字段（全部可选）：
        title:         '京都漫步'（标题）
        shoot_date:    '2026-05-20'（拍摄日期，默认今天）
        location:      '京都·岚山'（拍摄地点）
        description:   '和友人一起扫街'（描述）
        weather:       '晴' / '阴' / '雨' / '多云'
        tags:          ['街拍', '人文', '京都']
        rating:        1~5（星评价）
        camera_used:   ['Leica M6', 'Nikon F3']
        film_used:     ['Portra 400', 'Tri-X 400']
        notes:         '整体偏暗，下次加半档曝光'
    parameters:
      - name: title
        type: string
        required: false
        description: 拍摄活动名称，如"京都红枫"。不传则自动用地点/日期命名
      - name: data
        type: object
        required: false
        description: 自由 JSON 数据，AI 决定字段

  - name: shoot_query
    handler: shoot_query
    description: |
      查询拍摄记录。支持任意 JSON 字段过滤。
      示例：{"location": "京都"}、{"weather": "晴"}、{"shoot_date": "2026-05-20"}
    parameters:
      - name: filters
        type: object
        required: false
        description: 过滤条件。键是 data 中的字段路径。
      - name: limit
        type: integer
        required: false
        description: 返回条数，默认 20

  - name: shoot_update
    handler: shoot_update
    description: 修改拍摄记录。只传入需要更新的字段。
    parameters:
      - name: entity_id
        type: string
        required: true
        description: 要修改的实体 ID
      - name: data
        type: object
        required: false
        description: 要更新的字段（合并到现有 data）
      - name: name
        type: string
        required: false
        description: 新的名称（可选）

  - name: shoot_delete
    handler: shoot_delete
    description: 删除拍摄记录。必须先确认。
    parameters:
      - name: entity_id
        type: string
        required: true
        description: 要删除的实体 ID
      - name: confirmed
        type: boolean
        required: false

  - name: film_load
    handler: film_load
    description: |
      记录装卷事件。把胶卷装进相机。
      AI 自动查找库存中的胶卷和相机，关联创建 film_loading 实体。
      注意：装卷不扣减库存，只改胶卷状态为"在机内"。
    parameters:
      - name: film_name
        type: string
        required: true
        description: 胶卷名称，系统会自动从库存中查找
      - name: camera_name
        type: string
        required: false
        description: 相机名称，系统会自动从设备库中查找
      - name: iso_setting
        type: integer
        required: false
        description: 实际拨盘的 ISO 值（与胶卷标定 ISO 不同时为迫冲/减感）
      - name: push_pull
        type: integer
        required: false
        description: 迫冲档位，+1 迫冲一档，-1 减感一档
      - name: shoot_title
        type: string
        required: false
        description: 关联的拍摄活动名称

  - name: film_unload
    handler: film_unload
    description: 记录退卷事件。自动查找该卷最新的"在机内"记录，标记为已退卷。
    parameters:
      - name: film_name
        type: string
        required: true
        description: 退卷的胶卷名称
      - name: frames_shot
        type: integer
        required: false
        description: 这次拍了多少张
      - name: camera_name
        type: string
        required: false
        description: 从哪台相机退卷（默认查最近记录）

  - name: film_finish
    handler: film_finish
    description: |
      标记胶卷已拍完。自动扣减库存 quantity - 1，
      当库存为 0 时标记胶卷状态为"已使用"。
    parameters:
      - name: film_name
        type: string
        required: true
        description: 拍完的胶卷名称
      - name: frames_shot
        type: integer
        required: false
        description: 最后一次拍了多少张

  - name: film_loading_query
    handler: film_loading_query
    description: 查询装卷状态。当前哪些卷在机内、哪些已退卷。
    parameters:
      - name: status
        type: string
        required: false
        enum: ["在机内", "已退卷", "已拍完"]
        description: 筛选状态，默认"在机内"
      - name: camera_name
        type: string
        required: false
        description: 按相机筛选
      - name: limit
        type: integer
        required: false
        description: 返回条数，默认 20

  - name: shoot_search
    handler: shoot_search
    description: 全文搜索拍摄记录。
    parameters:
      - name: query
        type: string
        required: true
        description: 搜索关键词
      - name: limit
        type: integer
        required: false
        description: 返回条数，默认 10
