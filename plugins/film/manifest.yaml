name: film-management
version: 2.0.0
description: 胶卷管理 — JSONB 灵活存储，AI 自由定义字段

tools:
  - name: film_add
    handler: film_add
    description: |
      添加胶卷记录。核心工具。

      data 是自由 JSON 对象，AI 根据对话内容决定存什么字段。
      参考字段（全部可选，不限于这些）：
        type:         '彩色负片' / '反转片' / '黑白负片' / '电影卷' ...
        brand:        'Kodak' / 'Fuji' / 'Ilford' / 'Lomography' ...
        iso:          100 / 200 / 400 / 800 / 1600 / 3200（数字）
        format:       '135' / '120' / '4×5' / '8×10' / '半格' / '110' ...
        frames:       36（135 默认）/ 12（120 默认）/ 72（半格）
        quantity:     数量（数字，默认 1）
        unit:         '卷' / '盒' / '张'（默认 '卷'）
        status:       '未使用' / '在机内' / '已退卷' / '已使用'（默认 '未使用'）
        storage:      '冰箱-上层' / '防潮箱' / '常温柜'
        purchase:     {'date': '2026-05-20', 'price': 180, 'channel': '淘宝'}
        expiry:       '2028-03'（有效期，YYYY-MM 格式）
        purpose:      '人像' / '街拍' / '风光' / '夜景'（拍摄用途）
        notes:        '这卷迫冲到 1600 用'（备注）
    parameters:
      - name: name
        type: string
        required: true
        description: 胶卷名称，如"Kodak Portra 400"、"富士 C200"
      - name: data
        type: object
        required: false
        description: |
          自由 JSON 数据。所有字段由 AI 根据对话内容决定。
          支持嵌套对象（如 purchase: {channel, price, date}）。
          不要存 name 和 entity_type，系统自动处理。

  - name: film_query
    handler: film_query
    description: |
      查询胶卷库存。支持任意 JSON 字段过滤。

      示例：
        {"status": "未使用", "iso": 400}
        {"type": "彩色负片", "purchase.channel": "淘宝"}
        {}  ← 不传 filters = 返回全部
    parameters:
      - name: filters
        type: object
        required: false
        description: |
          过滤条件字典。键是 data 中的字段路径，值是精确匹配值。
          支持嵌套路径如 "purchase.channel"。
      - name: limit
        type: integer
        required: false
        description: 返回条数，默认 50

  - name: film_update
    handler: film_update
    description: |
      修改胶卷记录。只传入需要更新的字段。
      例如：data = {"status": "已使用", "storage": "冲扫区"}
    parameters:
      - name: entity_id
        type: string
        required: true
        description: 要修改的实体 ID
      - name: data
        type: object
        required: false
        description: |
          要更新的字段。与 data 合并（只覆盖同名键，不删除未传的字段）。
      - name: name
        type: string
        required: false
        description: 新的名称（可选）

  - name: film_delete
    handler: film_delete
    description: 删除胶卷记录。必须先查询确认。
    parameters:
      - name: entity_id
        type: string
        required: true
        description: 要删除的实体 ID
      - name: confirmed
        type: boolean
        required: false
        description: 用户确认后才传 true

  - name: film_search
    handler: film_search
    description: |
      全文搜索胶卷（FTS5）。自然语言查询，不需要精确匹配。
      示例："Portra 400 人像"、"过期彩色负片"、"Kodak 135"
    parameters:
      - name: query
        type: string
        required: true
        description: 搜索关键词
      - name: limit
        type: integer
        required: false
        description: 返回条数，默认 10

  - name: film_stats
    handler: film_stats
    description: 获取胶卷库存统计概览（总数、总价值、过期数量）
    parameters: []

  - name: film_check_expiry
    handler: film_check_expiry
    description: 检查即将过期（30天内）和已过期的胶卷
    parameters: []
