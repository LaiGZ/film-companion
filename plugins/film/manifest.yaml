name: film-management
version: 1.0.0
description: 胶卷管理 — 记录、查询、修改、删除胶卷库存

tools:
  - name: add_film
    handler: add_film
    description: 添加一条胶卷记录到库存。当用户说"买了/入了/到了 ×× 卷"时调用。
    parameters:
      - name: name
        type: string
        required: true
        description: 胶卷型号名称，如"富士 Provia 100F"、"柯达 Portra 400"、"伊尔福 HP5"
      - name: quantity
        type: integer
        required: false
        description: 数量（卷），默认为 1
      - name: iso
        type: integer
        required: false
        description: 感光度，如 100、400、800
      - name: film_type
        type: string
        required: false
        enum: ["彩色反转片", "彩色负片", "黑白负片", "电影卷"]
        description: 胶卷类型。如果不确定可以留空，用 name 推断
      - name: format
        type: string
        required: false
        enum: ["135", "120", "半格", "110", "126", "127", "4x5", "5x7", "8x10", "20x24"]
        description: 胶卷格式（135 / 120 / 半格 / 4×5 / 5×7 / 8×10）
      - name: frames
        type: integer
        required: false
        description: 张数。135默认36张，120默认12张（6×6），半格默认72。大画幅散页用 sheet_count
      - name: sheet_count
        type: integer
        required: false
        description: 散页片张数（大画幅 4×5 / 8×10 按盒卖时用，如 50 张一盒）
      - name: purchase_date
        type: string
        required: false
        description: 购买日期，格式 YYYY-MM-DD
      - name: expiry_date
        type: string
        required: false
        description: 到期日，格式 YYYY-MM-DD。用户提到"过期的"、"有效期"时就填
      - name: price
        type: number
        required: false
        description: 买入单价（元）
      - name: storage_location
        type: string
        required: false
        description: 存放位置，如"冰箱"、"书房"
      - name: status
        type: string
        required: false
        enum: ["未使用", "已拍摄", "已冲洗", "已扫描", "已使用"]
        description: 胶卷状态，默认为"未使用"
      - name: meta
        type: object
        required: false
        description: 扩展信息（JSON 对象）。放所有不匹配以上字段的信息。例如：{"store":"厦门中山路", "note":"拍风光用", "batch":"202305"}

  - name: query_film
    handler: query_film
    description: 查询胶卷库存。支持多种过滤条件。当用户说"有哪些/查一下/看看/还有多少 / ISO ××"时调用。
    parameters:
      - name: filters
        type: object
        required: false
        description: 过滤条件。例如 {"film_type":"彩色反转片", "iso__gte":400, "status":"未使用", "name__ilike":"Prova"}
      - name: order_by
        type: string
        required: false
        enum: ["created_at", "name", "iso", "expiry_date", "quantity", "price"]
        description: 排序字段，默认 created_at
      - name: order_dir
        type: string
        required: false
        enum: ["ASC", "DESC"]
        description: 排序方向，默认 DESC
      - name: limit
        type: integer
        required: false
        description: 返回条数上限，默认 50

  - name: update_film
    handler: update_film
    description: 修改胶卷记录。当用户说"改成/补充/更新/用了一卷/拍完了"时调用。
    parameters:
      - name: film_id
        type: string
        required: true
        description: 要修改的胶卷 ID（从查询结果中获取）
      - name: name
        type: string
        required: false
        description: 新的型号名称
      - name: quantity
        type: integer
        required: false
        description: 新的数量
      - name: iso
        type: integer
        required: false
        description: 新的感光度
      - name: film_type
        type: string
        required: false
        description: 新的胶卷类型
      - name: format
        type: string
        required: false
        description: 新的格式
      - name: status
        type: string
        required: false
        description: 新的状态（未使用/已拍摄/已冲洗/已扫描/已使用）
      - name: storage_location
        type: string
        required: false
        description: 新的存放位置
      - name: price
        type: number
        required: false
        description: 新的价格
      - name: meta
        type: object
        required: false
        description: 要补充或更新的扩展信息。会合并到已有 meta 中。

  - name: delete_film
    handler: delete_film
    description: 删除胶卷记录。当用户说"删掉/移除/取消"时调用。注意：删除前必须先查询确认。
    parameters:
      - name: film_id
        type: string
        required: true
        description: 要删除的胶卷 ID
      - name: confirmed
        type: boolean
        required: false
        description: 用户是否明确确认删除。必须确认后才执行。

  - name: check_expiring_film
    handler: check_expiring_film
    description: 检查即将过期或已过期的胶卷。当用户说"快过期的"、"要过期了"、"什么时候过期"时调用。
    parameters: []
