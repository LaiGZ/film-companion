<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>胶片伴侣 AI</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #1e2a4a;
    --sidebar: #131b2e;
    --primary: #e94560;
    --primary-hover: #d63850;
    --accent: #f5a623;
    --text: #eaeaea;
    --text2: #8a8a9a;
    --text3: #5a5a6a;
    --user-bubble: #2a3a6a;
    --ai-bubble: #1e2a4a;
    --border: #2a3a6a;
    --border-light: #3a4a7a;
    --success: #4caf50;
    --warning: #f5a623;
    --danger: #e94560;
    --hover: #1f2d50;
    --active-session: #1a2a4a;
    --sidebar-width: 260px;
    --header-bg: var(--surface);
    --input-bg: var(--surface2);
    --overlay: rgba(0,0,0,0.5);
    --shadow: rgba(0,0,0,0.4);
    --scrollbar-thumb: var(--border);
    --scrollbar-track: transparent;
  }

  /* ===== 浅色主题 ===== */
  body.light {
    --bg: #f8f6f2;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --sidebar: #f5f2ed;
    --primary: #c0392b;
    --primary-hover: #a93226;
    --accent: #d4871a;
    --text: #2c2c2c;
    --text2: #6b6b6b;
    --text3: #999999;
    --user-bubble: #dfe6ed;
    --ai-bubble: #ffffff;
    --border: #ddd8d0;
    --border-light: #e8e4dc;
    --success: #27ae60;
    --warning: #d4871a;
    --danger: #c0392b;
    --hover: #eae6e0;
    --active-session: #e8e3db;
    --header-bg: #ffffff;
    --input-bg: #f0ede8;
    --overlay: rgba(0,0,0,0.25);
    --shadow: rgba(0,0,0,0.1);
    --scrollbar-thumb: #ccc;
    --scrollbar-track: #f0ede8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background 0.3s ease, color 0.3s ease;
  }

  /* ===== 顶部导航 ===== */
  .header {
    background: var(--header-bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    z-index: 10;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .theme-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    width: 34px;
    height: 34px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .theme-btn:hover {
    background: var(--hover);
    color: var(--text);
  }

  .menu-btn {
    display: none;
    background: none;
    border: 1px solid var(--border);
    color: var(--text2);
    width: 36px;
    height: 36px;
    border-radius: 8px;
    font-size: 18px;
    cursor: pointer;
    align-items: center;
    justify-content: center;
  }

  .logo { font-size: 22px; }
  .title { font-size: 17px; font-weight: 600; }
  .subtitle { font-size: 11px; color: var(--text2); margin-top: 1px; }

  .nav-links { display: flex; gap: 6px; }
  .nav-link {
    color: var(--text2); text-decoration: none;
    padding: 6px 12px; border-radius: 6px;
    font-size: 13px; transition: all 0.2s;
  }
  .nav-link:hover, .nav-link.active {
    background: var(--surface2); color: var(--text);
  }

  /* ===== 主体布局 ===== */
  .main-layout {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ===== 侧栏 ===== */
  .sidebar {
    width: var(--sidebar-width);
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .sidebar-close-btn { display: none; }

  .sidebar-title {
    font-size: 13px;
    color: var(--text2);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .new-session-btn {
    background: var(--primary);
    color: white;
    border: none;
    width: 30px;
    height: 30px;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .new-session-btn:hover { opacity: 0.85; }

  .session-list {
    flex: 1;
    overflow-y: auto;
    padding: 6px 0;
  }

  .session-list::-webkit-scrollbar { width: 4px; }
  .session-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .session-item {
    padding: 10px 14px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: all 0.15s;
    margin: 1px 6px;
    border-radius: 8px;
  }

  .session-item:hover { background: var(--hover); }
  .session-item.active {
    background: var(--active-session);
    border-left-color: var(--primary);
  }

  .session-item-title {
    font-size: 14px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 2px;
  }

  .session-item-preview {
    font-size: 12px;
    color: var(--text3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .session-item-meta {
    font-size: 11px;
    color: var(--text3);
    margin-top: 3px;
  }

  /* ===== 聊天区域 ===== */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .chat-session-header {
    padding: 8px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    font-size: 13px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px 0;
    scroll-behavior: smooth;
  }

  .chat-container::-webkit-scrollbar { width: 6px; }
  .chat-container::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .chat-container::-webkit-scrollbar-track { background: transparent; }

  .chat-inner {
    max-width: 800px;
    margin: 0 auto;
    padding: 0 24px;
  }

  /* ===== 消息气泡 ===== */
  .message {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
    animation: fadeIn 0.25s ease;
  }

  /* 移动端适配：iOS 键盘弹出时不缩放 */
  @supports (-webkit-touch-callout: none) {
    textarea, input, button { font-size: 16px; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
  }

  .avatar.user { background: var(--user-bubble); }
  .avatar.ai { background: var(--primary); }
  .avatar.system { background: var(--surface2); font-size: 12px; }

  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.6;
    font-size: 15px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .message.user .bubble {
    background: var(--user-bubble);
    border-bottom-right-radius: 4px;
  }

  .message.ai .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }

  .message.system .bubble {
    background: var(--surface2);
    border: 1px solid transparent;
    border-radius: 10px;
    font-size: 13px;
    color: var(--text2);
    text-align: center;
    max-width: 90%;
    margin: 0 auto;
  }

  .bubble table {
    width: 100%;
    border-collapse: collapse;
    margin: 6px 0;
    font-size: 14px;
  }

  .bubble th, .bubble td {
    border: 1px solid var(--border);
    padding: 5px 8px;
    text-align: left;
  }

  .bubble th { background: var(--surface2); font-weight: 600; }
  .bubble table tr:last-child td:first-child { border-bottom-left-radius: 4px; }
  .bubble table tr:last-child td:last-child { border-bottom-right-radius: 4px; }

  /* ===== 光标闪烁 ===== */
  .cursor-blink {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--primary);
    margin-left: 2px;
    animation: blink 0.8s step-end infinite;
    vertical-align: text-bottom;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  /* ===== 工具调用指示 ===== */
  .tool-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    font-size: 13px;
    padding: 6px 0 10px 42px;
    animation: fadeIn 0.2s ease;
  }

  .tool-indicator .spinner {
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ===== 打字指示 ===== */
  .typing-indicator {
    display: none;
    align-items: center;
    gap: 8px;
    color: var(--text2);
    font-size: 14px;
    margin-bottom: 18px;
    padding-left: 42px;
  }

  .typing-indicator.active { display: flex; }

  .dots { display: flex; gap: 4px; }
  .dots span {
    width: 7px; height: 7px;
    background: var(--text2);
    border-radius: 50%;
    animation: bounce 1.4s infinite;
  }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  /* ===== 欢迎页 ===== */
  .welcome {
    text-align: center;
    padding: 60px 0 30px;
  }

  .welcome-icon { font-size: 56px; margin-bottom: 12px; }
  .welcome h2 { font-size: 22px; margin-bottom: 6px; }
  .welcome p {
    color: var(--text2);
    font-size: 14px;
    max-width: 450px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .suggestions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 20px;
  }

  .suggestion-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .suggestion-btn:hover {
    background: var(--user-bubble);
    color: var(--text);
    border-color: var(--primary);
  }

  /* ===== 输入区域 ===== */
  .input-area {
    background: var(--input-bg);
    border-top: 1px solid var(--border);
    padding: 14px 24px;
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    flex-shrink: 0;
  }

  .input-inner {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .input-wrapper {
    flex: 1;
    display: flex;
    align-items: flex-end;
    gap: 6px;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 4px 10px;
    transition: border-color 0.2s;
  }

  .input-wrapper:focus-within { border-color: var(--primary); }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    padding: 7px 0;
    min-height: 22px;
    max-height: 100px;
    line-height: 1.5;
  }

  textarea::placeholder { color: var(--text2); }

  .send-btn {
    background: var(--primary);
    color: white;
    border: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .send-btn:hover { opacity: 0.9; transform: scale(1.05); }
  .send-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  /* ===== 响应式 ===== */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      left: -290px;
      top: 0;
      bottom: 0;
      z-index: 100;
      width: 280px;
      transition: left 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 4px 0 30px var(--shadow);
    }

    .sidebar.open { left: 0; }

    .menu-btn { display: flex; }

    .sidebar-header { padding: 14px; }

    .sidebar-close-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border: none;
      background: none;
      color: var(--text2);
      font-size: 18px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .sidebar-close-btn:hover { background: var(--hover); color: var(--text); }
    .session-item { padding: 12px 14px; }

    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: var(--overlay);
      z-index: 99;
    }

    .sidebar-overlay.show { display: block; }

    .bubble { max-width: 88%; font-size: 14px; }
    .message.user .bubble { max-width: 82%; }
    .header { padding: 10px 12px; }
    .chat-inner { padding: 0 12px; }
    .input-area { padding: 10px 12px; }
    .chat-container { padding: 12px 0; }

    .avatar { width: 28px; height: 28px; font-size: 14px; }
    .message { gap: 8px; margin-bottom: 14px; }
    .bubble { padding: 8px 12px; }
    .bubble table { font-size: 12px; }
    .bubble th, .bubble td { padding: 3px 5px; }

    .suggestion-btn { padding: 8px 14px; font-size: 13px; }
    .welcome { padding: 40px 0 24px; }
    .welcome-icon { font-size: 44px; }
    .welcome h2 { font-size: 19px; }

    .send-btn { width: 40px; height: 40px; font-size: 17px; }
    textarea { font-size: 16px; } /* 防 iOS 缩放 */
    .input-wrapper { padding: 4px 8px; }

    .theme-btn { width: 38px; height: 38px; }
    .nav-link { padding: 8px 10px; }
    .title { font-size: 15px; }
    .subtitle { font-size: 10px; }
  }

  @media (max-width: 400px) {
    .sidebar { width: 100%; left: -100%; }
    .bubble { max-width: 92%; }
    .message.user .bubble { max-width: 85%; }
    .logo { font-size: 18px; }
    .title { font-size: 14px; }
    .subtitle { display: none; }
    .nav-link { font-size: 11px; padding: 6px 8px; }
    .chat-session-header { font-size: 12px; padding: 6px 12px; }
    .welcome { padding: 30px 0 20px; }
    .suggestion-btn { font-size: 12px; padding: 6px 12px; }
  }
</style>
</head>
<body>

<!-- 侧栏遮罩（移动端） -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- 顶部导航 -->
<div class="header">
  <div class="header-left">
    <button class="menu-btn" onclick="toggleSidebar()">☰</button>
    <span class="logo">🎞️</span>
    <div>
      <div class="title">胶片伴侣 AI</div>
      <div class="subtitle">对话式胶片管理助手</div>
    </div>
  </div>
  <div class="nav-links">
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
    <a href="/" class="nav-link active">💬 对话</a>
    <a href="/data" class="nav-link">📊 数据</a>
  </div>
</div>

<!-- 主体布局 -->
<div class="main-layout">

  <!-- 侧栏：会话列表 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="sidebar-title">📋 会话列表</span>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="new-session-btn" onclick="createNewSession()" title="新建会话">＋</button>
        <button class="sidebar-close-btn" onclick="closeSidebar()" title="关闭">✕</button>
      </div>
    </div>
    <div class="session-list" id="sessionList">
      <!-- 动态渲染 -->
    </div>
  </div>

  <!-- 聊天区域 -->
  <div class="chat-area">
    <div class="chat-session-header" id="sessionHeader">
      <span id="sessionLabel">选择或新建一个会话</span>
    </div>

    <div class="chat-container" id="chatContainer">
      <div class="chat-inner" id="chatInner">
        <!-- 欢迎页 -->
        <div class="welcome" id="welcome">
          <div class="welcome-icon">🎞️</div>
          <h2>欢迎来到胶片伴侣</h2>
          <p>你的 AI 胶片管理助手。<br>说人话就能管好胶卷和设备，不用填表单。</p>
          <div class="suggestions">
            <button class="suggestion-btn" onclick="sendSuggestion('买了3卷富士 Provia 100F')">📸 录入胶卷</button>
            <button class="suggestion-btn" onclick="sendSuggestion('我有哪些反转片？')">🔍 查库存</button>
            <button class="suggestion-btn" onclick="sendSuggestion('快过期的胶卷有哪些？')">⚠️ 过期提醒</button>
            <button class="suggestion-btn" onclick="sendSuggestion('我有哪些相机？')">📷 查设备</button>
          </div>
        </div>

        <!-- 消息列表 -->
        <div id="messageList"></div>

        <!-- 工具调用指示 -->
        <div class="tool-indicator" id="toolIndicator" style="display:none;">
          <div class="spinner"></div>
          <span id="toolIndicatorText">正在处理...</span>
        </div>

        <!-- 打字指示 -->
        <div class="typing-indicator" id="typingIndicator">
          <div class="dots">
            <span></span><span></span><span></span>
          </div>
          <span>胶片伴侣正在思考...</span>
        </div>
      </div>
    </div>

    <!-- 输入区域 -->
    <div class="input-area">
      <div class="input-inner">
        <div class="input-wrapper">
          <textarea id="messageInput" rows="1"
                    placeholder="说句话，比如「买了3卷 Provia 100F」..."
                    onkeydown="handleKeydown(event)"
                    oninput="autoResize(this)"></textarea>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">▶</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
<script>
// ============================================================
// 状态
// ============================================================
let currentSessionId = null;
let isLoading = false;
let abortController = null;
let sessions = [];
let allSessions = {};  // session_id -> full data cache

// ============================================================
// DOM 操作
// ============================================================

function scrollToBottom() {
  const container = document.getElementById('chatContainer');
  setTimeout(() => {
    container.scrollTop = container.scrollHeight;
  }, 30);
}

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = Math.min(textarea.scrollHeight, 100) + 'px';
}

function hideWelcome() {
  const w = document.getElementById('welcome');
  if (w) w.style.display = 'none';
}

function setLoading(loading) {
  isLoading = loading;
  const btn = document.getElementById('sendBtn');
  const input = document.getElementById('messageInput');
  btn.disabled = loading;
  input.disabled = loading;
  const indicator = document.getElementById('typingIndicator');
  indicator.classList.toggle('active', loading && !document.getElementById('toolIndicator').style.display !== 'none');
}

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// ============================================================
// 消息渲染
// ============================================================

function addMessage(role, content) {
  hideWelcome();
  const list = document.getElementById('messageList');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'user' ? '👤' : role === 'system' ? '⚙️' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  // AI 消息渲染 Markdown，用户消息保持纯文本
  if (role === 'assistant' && typeof marked !== 'undefined') {
    bubble.innerHTML = marked.parse(content);
  } else {
    bubble.textContent = content;
  }

  div.appendChild(avatar);
  div.appendChild(bubble);
  list.appendChild(div);
  scrollToBottom();
}

function addMessageHtml(role, html) {
  hideWelcome();
  const list = document.getElementById('messageList');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === 'user' ? '👤' : role === 'system' ? '⚙️' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = html;

  div.appendChild(avatar);
  div.appendChild(bubble);
  list.appendChild(div);
  scrollToBottom();
}

// 创建或获取流式消息气泡
function getStreamBubble() {
  const list = document.getElementById('messageList');
  let lastAiMsg = list.lastElementChild;
  if (lastAiMsg && lastAiMsg.classList.contains('message') && lastAiMsg.classList.contains('ai')) {
    return lastAiMsg.querySelector('.bubble');
  }
  // 没有 AI 气泡，创建一个
  const div = document.createElement('div');
  div.className = 'message ai';

  const avatar = document.createElement('div');
  avatar.className = 'avatar ai';
  avatar.textContent = '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  div.appendChild(avatar);
  div.appendChild(bubble);
  list.appendChild(div);
  scrollToBottom();
  return bubble;
}

let streamBubble = null;
let streamRawText = '';

function appendStreamToken(text) {
  hideWelcome();
  if (!streamBubble) {
    streamBubble = getStreamBubble();
  }
  // 移除末尾光标
  const cursor = streamBubble.querySelector('.cursor-blink');
  if (cursor) cursor.remove();

  streamRawText += text;
  // 流式过程中显示纯文本（等完成后再渲染 Markdown）
  streamBubble.textContent = streamRawText;

  // 加回光标
  const blinkSpan = document.createElement('span');
  blinkSpan.className = 'cursor-blink';
  streamBubble.appendChild(blinkSpan);

  scrollToBottom();
}

function finalizeStream() {
  if (streamBubble) {
    const cursor = streamBubble.querySelector('.cursor-blink');
    if (cursor) cursor.remove();
    // 流式完成后渲染 Markdown
    if (typeof marked !== 'undefined' && streamRawText) {
      streamBubble.innerHTML = marked.parse(streamRawText);
    }
    streamBubble = null;
    streamRawText = '';
  }
}

function showToolIndicator(tools) {
  const el = document.getElementById('toolIndicator');
  document.getElementById('toolIndicatorText').textContent = `正在执行: ${tools.join(', ')}`;
  el.style.display = 'flex';
  scrollToBottom();
}

function hideToolIndicator() {
  document.getElementById('toolIndicator').style.display = 'none';
}

// ============================================================
// 会话管理
// ============================================================

async function loadSessions() {
  try {
    const resp = await fetch('/api/sessions');
    const data = await resp.json();
    sessions = data.sessions || [];
    renderSessionList();
  } catch (err) {
    console.error('加载会话列表失败:', err);
  }
}

async function refreshSessions() {
  const oldSid = currentSessionId;
  await loadSessions();
  // 保持当前会话高亮
  if (oldSid) {
    highlightSession(oldSid);
  }
}

function renderSessionList() {
  const list = document.getElementById('sessionList');
  list.innerHTML = '';

  if (!sessions.length) {
    list.innerHTML = '<div style="padding: 20px 14px; color: var(--text3); font-size: 13px; text-align: center;">暂无会话，点击 ＋ 新建</div>';
    return;
  }

  for (const s of sessions) {
    const item = document.createElement('div');
    item.className = 'session-item';
    item.dataset.sid = s.id;
    if (s.id === currentSessionId) {
      item.classList.add('active');
    }

    // 会话标题
    const titleEl = document.createElement('div');
    titleEl.className = 'session-item-title';
    titleEl.textContent = s.title || s.last_preview || '新会话';

    // 预览
    const previewEl = document.createElement('div');
    previewEl.className = 'session-item-preview';
    previewEl.textContent = s.last_preview || '';

    // 时间
    const metaEl = document.createElement('div');
    metaEl.className = 'session-item-meta';
    if (s.last_activity) {
      const d = new Date(s.last_activity.replace(' ', 'T') + 'Z');
      const now = new Date();
      const diff = now - d;
      if (diff < 60000) metaEl.textContent = '刚刚';
      else if (diff < 3600000) metaEl.textContent = `${Math.floor(diff / 60000)} 分钟前`;
      else if (diff < 86400000) metaEl.textContent = `${Math.floor(diff / 3600000)} 小时前`;
      else metaEl.textContent = d.toLocaleDateString('zh-CN');
    }
    if (s.msg_count > 0) {
      metaEl.textContent += ` · ${s.msg_count} 条消息`;
    }

    item.appendChild(titleEl);
    item.appendChild(previewEl);
    item.appendChild(metaEl);

    item.onclick = () => switchSession(s.id);
    list.appendChild(item);
  }
}

function highlightSession(sid) {
  document.querySelectorAll('.session-item').forEach(el => {
    el.classList.toggle('active', el.dataset.sid === sid);
  });
}

function updateSessionHeader(sessionId) {
  const label = document.getElementById('sessionLabel');
  const s = sessions.find(x => x.id === sessionId);
  if (s) {
    const title = s.title || s.last_preview || '对话';
    label.textContent = `💬 ${title.length > 28 ? title.slice(0, 28) + '...' : title}`;
  } else {
    label.textContent = '💬 新会话';
  }
}

// ============================================================
// 会话切换
// ============================================================

async function switchSession(sessionId) {
  if (sessionId === currentSessionId) return;
  closeSidebar();

  // 如果正在流式，取消
  if (abortController) {
    abortController.abort();
    abortController = null;
  }

  currentSessionId = sessionId;
  highlightSession(sessionId);
  updateSessionHeader(sessionId);
  await loadSessionMessages(sessionId);
}

async function loadSessionMessages(sessionId) {
  try {
    const resp = await fetch(`/api/sessions/${sessionId}`);
    const data = await resp.json();
    if (data.status !== 'ok') return;

    // 清除消息区
    const list = document.getElementById('messageList');
    list.innerHTML = '';
    hideWelcome();
    finalizeStream();

    // 渲染消息
    const msgs = data.messages || [];
    for (const m of msgs) {
      if (m.role === 'user' || m.role === 'assistant') {
        addMessage(m.role, m.content);
      }
    }

    scrollToBottom();
  } catch (err) {
    console.error('加载会话消息失败:', err);
  }
}

async function createNewSession() {
  if (abortController) {
    abortController.abort();
    abortController = null;
  }
  finalizeStream();

  try {
    const resp = await fetch('/api/sessions', { method: 'POST' });
    const data = await resp.json();
    currentSessionId = data.session_id;

    // 清空聊天区
    document.getElementById('messageList').innerHTML = '';
    const welcome = document.getElementById('welcome');
    welcome.style.display = '';
    finalizeStream();

    // 更新侧栏
    await loadSessions();
    highlightSession(currentSessionId);
    updateSessionHeader(currentSessionId);
  } catch (err) {
    console.error('创建会话失败:', err);
  }
}

// ============================================================
// SSE 流式聊天
// ============================================================

async function sendMessage(message) {
  const input = document.getElementById('messageInput');
  const text = (message || input.value).trim();
  if (!text || isLoading) return;

  // 确保有会话
  if (!currentSessionId) {
    await createNewSession();
    if (!currentSessionId) return;
  }

  // 清空输入
  input.value = '';
  autoResize(input);

  // 显示用户消息
  addMessage('user', text);
  hideWelcome();

  // 设置加载状态
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('messageInput').disabled = true;
  document.getElementById('typingIndicator').classList.add('active');

  // 创建 AbortController
  abortController = new AbortController();
  streamBubble = null;

  try {
    const response = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        message: text,
        session_id: currentSessionId,
      }),
      signal: abortController.signal,
    });

    if (!response.ok) {
      const err = await response.json().catch(() => ({ detail: '未知错误' }));
      addMessage('ai', `❌ 出错了: ${err.detail || response.statusText}`);
      return;
    }

    const reader = response.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });

      // 逐行解析 SSE
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';  // 保留不完整的行

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const payload = line.slice(6);
        let event;
        try {
          event = JSON.parse(payload);
        } catch {
          continue;
        }

        // 隐藏打字指示
        document.getElementById('typingIndicator').classList.remove('active');

        switch (event.type) {
          case 'token':
            appendStreamToken(event.content);
            break;

          case 'tool_start':
            hideToolIndicator();
            showToolIndicator(event.tools);
            break;

          case 'tool_result':
            // 工具结果 — 不显示详细内容，只更新指示器文字
            document.getElementById('toolIndicatorText').textContent =
              `✅ ${event.name} 完成`;
            break;

          case 'done':
            hideToolIndicator();
            finalizeStream();
            currentSessionId = event.session_id;
            // 刷新会话列表
            await refreshSessions();
            updateSessionHeader(currentSessionId);
            break;

          case 'error':
            hideToolIndicator();
            finalizeStream();
            addMessage('system', `⚠️ ${event.content}`);
            break;
        }
      }
    }
  } catch (err) {
    if (err.name === 'AbortError') {
      // 用户切换会话导致的中断，忽略
    } else {
      hideToolIndicator();
      finalizeStream();
      addMessage('ai', `❌ 网络错误: ${err.message}`);
    }
  } finally {
    isLoading = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('messageInput').disabled = false;
    if (!abortController || !abortController.signal.aborted) {
      // 如果不是因为切换会话而中断
      document.getElementById('typingIndicator').classList.remove('active');
    }
    abortController = null;
  }
}

function sendSuggestion(text) {
  document.getElementById('messageInput').value = text;
  sendMessage();
}

function handleKeydown(event) {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
}

// ============================================================
// 主题切换
// ============================================================

function toggleTheme() {
  const body = document.body;
  const isLight = body.classList.toggle('light');
  document.getElementById('themeBtn').textContent = isLight ? '☀️' : '🌙';
  localStorage.setItem('film-companion-theme', isLight ? 'light' : 'dark');
}

function loadTheme() {
  const saved = localStorage.getItem('film-companion-theme');
  if (saved === 'light') {
    document.body.classList.add('light');
    document.getElementById('themeBtn').textContent = '☀️';
  }
}

// ============================================================
// 初始化：自动加载最后一次会话
// ============================================================

async function init() {
  loadTheme();
  await loadSessions();

  if (sessions.length > 0) {
    // 自动加载最后一次会话
    const lastSession = sessions[0];
    await switchSession(lastSession.id);
  } else {
    // 无会话，自动创建一个
    await createNewSession();
  }
}

init();
</script>
