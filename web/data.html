<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>胶片伴侣 AI - 数据</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #1e2a4a;
    --primary: #e94560;
    --accent: #f5a623;
    --text: #eaeaea;
    --text2: #a0a0b0;
    --border: #2a3a6a;
    --success: #4caf50;
    --warning: #f5a623;
    --danger: #e94560;
    --info: #4fc3f7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* 导航 */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo { font-size: 24px; }
  .title { font-size: 18px; font-weight: 600; }

  .nav-links { display: flex; gap: 8px; }
  .header-right { display: flex; align-items: center; gap: 6px; }
  .user-info { display: flex; align-items: center; gap: 8px; }
  .nav-link {
    color: var(--text2);
    text-decoration: none;
    padding: 6px 14px;
    border-radius: 6px;
    font-size: 14px;
    transition: all 0.2s;
  }
  .nav-link:hover, .nav-link.active {
    background: var(--surface2);
    color: var(--text);
  }
  .nav-link.active { border-bottom: 2px solid var(--primary); }

  /* 主容器 */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
  }

  /* 统计卡片 */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    text-align: center;
  }

  .stat-icon { font-size: 28px; margin-bottom: 8px; }
  .stat-value { font-size: 28px; font-weight: 700; }
  .stat-label { font-size: 13px; color: var(--text2); margin-top: 4px; }

  /* Tab 切换 */
  .tabs {
    display: flex;
    gap: 0;
    margin-bottom: 0;
    border-bottom: 2px solid var(--border);
  }

  .tab {
    padding: 12px 24px;
    cursor: pointer;
    color: var(--text2);
    border-bottom: 2px solid transparent;
    margin-bottom: -2px;
    transition: all 0.2s;
    font-size: 15px;
    font-weight: 500;
  }

  .tab:hover { color: var(--text); }
  .tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }

  /* 筛选栏 */
  .filter-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 12px 12px;
    padding: 16px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-bottom: 16px;
  }

  .filter-bar select, .filter-bar input {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
  }

  .filter-bar select:focus, .filter-bar input:focus {
    border-color: var(--primary);
  }

  .filter-bar .refresh-btn {
    background: var(--primary);
    color: white;
    border: none;
    padding: 8px 20px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
    margin-left: auto;
  }

  .filter-bar .refresh-btn:hover {
    opacity: 0.9;
  }

  /* 表格 */
  .table-container {
    overflow-x: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th {
    background: var(--surface2);
    padding: 12px 16px;
    text-align: left;
    font-weight: 600;
    color: var(--text);
    white-space: nowrap;
    position: sticky;
    top: 0;
    cursor: pointer;
    user-select: none;
  }

  th:hover {
    background: #25335a;
  }

  th .sort-icon {
    margin-left: 4px;
    opacity: 0.4;
  }

  th.sorted .sort-icon {
    opacity: 1;
    color: var(--primary);
  }

  td {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    white-space: nowrap;
  }

  tr:hover td {
    background: rgba(233, 69, 96, 0.05);
  }

  /* 状态徽章 */
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
  }

  .badge-used { background: rgba(76, 175, 80, 0.2); color: var(--success); }
  .badge-shooting { background: rgba(79, 195, 247, 0.2); color: var(--info); }
  .badge-warning { background: rgba(245, 166, 35, 0.2); color: var(--warning); }
  .badge-expired { background: rgba(233, 69, 96, 0.2); color: var(--danger); }
  .badge-ok { background: rgba(76, 175, 80, 0.2); color: var(--success); }
  .badge-inactive { background: rgba(160, 160, 176, 0.2); color: var(--text2); }

  /* 空状态 */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
  }

  .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; }

  /* JSON 元数据 */
  .meta-cell {
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    cursor: pointer;
    color: var(--text2);
    font-size: 13px;
  }

  .meta-cell:hover {
    color: var(--accent);
  }

  /* 过期标签 */
  .expiry-label {
    font-size: 12px;
  }
  .expiry-label.warning { color: var(--warning); }
  .expiry-label.danger { color: var(--danger); }

  /* 加载 */
  .loading {
    text-align: center;
    padding: 40px;
    color: var(--text2);
  }

  .pagination {
    display: flex;
    justify-content: center;
    gap: 8px;
    padding: 16px;
  }

  .page-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
  }

  .page-btn:hover { background: var(--user-bubble); }
  .page-btn.active { background: var(--primary); border-color: var(--primary); }

  @media (max-width: 768px) {
    .container { padding: 16px; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    th, td { padding: 8px 10px; font-size: 13px; }
  }
</style>

<!-- ===== 登录弹窗 CSS ===== -->
<style>
  .auth-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 999;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .auth-overlay.show { display: block; }
  .auth-modal {
    display: none;
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 1000;
    width: 360px;
    max-width: 90vw;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .auth-modal.show { display: block; }
  .auth-modal-logo { text-align: center; font-size: 40px; margin-bottom: 4px; }
  .auth-modal-title { text-align: center; font-size: 20px; font-weight: 600; margin-bottom: 24px; }
  .auth-form { display: flex; flex-direction: column; gap: 14px; }
  .auth-form label { font-size: 13px; color: var(--text2); font-weight: 500; }
  .auth-form input {
    width: 100%; padding: 10px 14px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px; font-family: inherit;
    outline: none;
    box-sizing: border-box;
  }
  .auth-form input:focus { border-color: var(--primary); }
  .auth-btn {
    width: 100%; padding: 11px;
    background: var(--primary); color: white;
    border: none; border-radius: 10px;
    font-size: 15px; font-weight: 600;
    cursor: pointer; margin-top: 4px;
  }
  .auth-btn:hover { opacity: 0.9; }
  .auth-error { color: var(--danger); font-size: 13px; text-align: center; min-height: 20px; }
  .auth-switch { text-align: center; font-size: 13px; color: var(--text2); margin-top: 8px; }
  .auth-switch a { color: var(--primary); cursor: pointer; text-decoration: none; font-weight: 500; }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="header">
  <div class="header-left">
    <span class="logo">🎞️</span>
    <div class="title">胶片伴侣 AI</div>
  </div>
  <div class="nav-links">
    <div class="user-info" id="userInfo"></div>
    <a href="/" class="nav-link">💬 对话</a>
    <a href="/data" class="nav-link active">📊 数据</a>
  </div>
</div>

<!-- 登录弹窗 -->
<div class="auth-overlay" id="authOverlay" onclick="if(event.target===this)Auth.close()"></div>
<div class="auth-modal" id="authModal">
  <div class="auth-modal-logo">🎞️</div>
  <div class="auth-modal-title" id="authModalTitle">登录</div>
  <div class="auth-form" id="loginForm">
    <div><label>用户名</label><input type="text" id="loginUsername" placeholder="输入用户名" autocomplete="username"></div>
    <div><label>密码</label><input type="password" id="loginPassword" placeholder="输入密码" autocomplete="current-password" onkeydown="if(event.key==='Enter')Auth.login()"></div>
    <div class="auth-error" id="authError"></div>
    <button class="auth-btn" onclick="Auth.login()">登 录</button>
    <div class="auth-switch">还没有账号？<a onclick="Auth.switchMode('register')">注册 →</a></div>
  </div>
  <div class="auth-form" id="registerForm" style="display:none">
    <div><label>用户名</label><input type="text" id="regUsername" placeholder="2-32个字符" autocomplete="off"></div>
    <div><label>密码</label><input type="password" id="regPassword" placeholder="至少6位" autocomplete="new-password"></div>
    <div><label>确认密码</label><input type="password" id="regConfirm" placeholder="再次输入密码" autocomplete="new-password" onkeydown="if(event.key==='Enter')Auth.register()"></div>
    <div class="auth-error" id="authError"></div>
    <button class="auth-btn" onclick="Auth.register()">注 册</button>
    <div class="auth-switch"><a onclick="Auth.switchMode('login')">← 返回登录</a></div>
  </div>
</div>

<!-- 主容器 -->
<div class="container">
  <!-- 统计卡片 -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-icon">🎞️</div>
      <div class="stat-value" id="filmCount">-</div>
      <div class="stat-label">胶卷总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">📷</div>
      <div class="stat-value" id="gearCount">-</div>
      <div class="stat-label">设备总数</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">💰</div>
      <div class="stat-value" id="totalValue">-</div>
      <div class="stat-label">总价值</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">⚠️</div>
      <div class="stat-value" id="expiringCount">-</div>
      <div class="stat-label">快过期/已过期</div>
    </div>
  </div>

  <!-- Tab -->
  <div class="tabs">
    <div class="tab active" onclick="switchTab('film')">🎞️ 胶卷</div>
    <div class="tab" onclick="switchTab('gear')">📷 设备</div>
  </div>

  <!-- 筛选栏 -->
  <div class="filter-bar" id="filterBar">
    <select id="statusFilter">
      <option value="">全部状态</option>
      <option value="未使用">未使用</option>
      <option value="已拍摄">已拍摄</option>
      <option value="已冲洗">已冲洗</option>
      <option value="已扫描">已扫描</option>
      <option value="已使用">已使用</option>
    </select>
    <select id="typeFilter">
      <option value="">全部类型</option>
      <option value="彩色反转片">彩色反转片</option>
      <option value="彩色负片">彩色负片</option>
      <option value="黑白负片">黑白负片</option>
      <option value="电影卷">电影卷</option>
    </select>
    <button class="refresh-btn" onclick="loadData()">🔄 刷新</button>
  </div>

  <!-- 表格 -->
  <div class="table-container" id="tableContainer">
    <div class="loading" id="loadingIndicator">加载中...</div>
  </div>
</div>

<script>
// ============================================================
// 状态
// ============================================================
let currentTab = 'film';
let currentSort = { field: 'created_at', dir: 'DESC' };

// ============================================================
// 数据加载
// ============================================================

async function loadStats() {
  try {
    const resp = await fetch('/api/stats');
    const data = await resp.json();
    if (data.status !== 'ok') return;

    const s = data.stats;
    document.getElementById('filmCount').textContent = s.film_count;
    document.getElementById('gearCount').textContent = s.gear_count;
    document.getElementById('totalValue').textContent = `¥${s.total_value.toLocaleString()}`;
    document.getElementById('expiringCount').textContent = `${s.expired_count + s.expiring_count}`;
  } catch (err) {
    console.error('加载统计失败:', err);
  }
}

async function loadData() {
  const container = document.getElementById('tableContainer');
  container.innerHTML = '<div class="loading">加载中...</div>';

  const statusEl = document.getElementById('statusFilter');
  const typeEl = document.getElementById('typeFilter');

  try {
    let url;
    if (currentTab === 'film') {
      const params = new URLSearchParams();
      if (statusEl.value) params.set('status', statusEl.value);
      if (typeEl.value) params.set('film_type', typeEl.value);
      params.set('sort', currentSort.field);
      params.set('order', currentSort.dir);
      params.set('limit', '500');
      url = `/api/film?${params.toString()}`;
    } else {
      const params = new URLSearchParams();
      if (statusEl.value) params.set('status', statusEl.value);
      if (typeEl.value) params.set('gear_type', typeEl.value);
      params.set('sort', currentSort.field);
      params.set('order', currentSort.dir);
      params.set('limit', '500');
      url = `/api/gear?${params.toString()}`;
    }

    const resp = await fetch(url);
    const data = await resp.json();

    if (data.status !== 'ok') {
      container.innerHTML = `<div class="empty-state"><p>❌ 加载失败</p></div>`;
      return;
    }

    if (currentTab === 'film') {
      renderFilmTable(data.films);
    } else {
      renderGearTable(data.gear);
    }
  } catch (err) {
    container.innerHTML = `<div class="empty-state"><p>❌ 错误: ${err.message}</p></div>`;
  }
}

// ============================================================
// 胶卷表格渲染
// ============================================================

function renderFilmTable(films) {
  const container = document.getElementById('tableContainer');

  if (!films || films.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">🎞️</div>
        <p>还没有胶卷记录<br>去 <a href="/" style="color:var(--primary)">对话页面</a> 录入吧</p>
      </div>`;
    return;
  }

  let html = `<table>
    <thead><tr>
      <th onclick="sortBy('name')">型号 ${getSortIcon('name')}</th>
      <th>类型</th>
      <th onclick="sortBy('iso')">ISO ${getSortIcon('iso')}</th>
      <th>格式</th>
      <th onclick="sortBy('quantity')">数量 ${getSortIcon('quantity')}</th>
      <th>状态</th>
      <th onclick="sortBy('expiry_date')">到期日 ${getSortIcon('expiry_date')}</th>
      <th onclick="sortBy('price')">价格 ${getSortIcon('price')}</th>
      <th>存放</th>
      <th>备注</th>
    </tr></thead>
    <tbody>`;

  for (const f of films) {
    const statusBadge = getFilmStatusBadge(f.status);
    const expiryBadge = getExpiryBadge(f.expiry_status, f.days_left);
    const metaStr = f.meta ? Object.entries(f.meta).map(([k,v]) => `${k}: ${v}`).join(', ') : '';

    html += `<tr>
      <td><strong>${escapeHtml(f.name)}</strong></td>
      <td>${escapeHtml(f.film_type || '-')}</td>
      <td>${f.iso ? `ISO ${f.iso}` : '-'}</td>
      <td>${f.format || '135'}</td>
      <td>${f.quantity} ${f.unit || '卷'}</td>
      <td>${statusBadge}</td>
      <td>${f.expiry_date ? `${f.expiry_date}<br>${expiryBadge}` : '-'}</td>
      <td>${f.price ? `¥${f.price}` : '-'}</td>
      <td>${escapeHtml(f.storage_location || '-')}</td>
      <td><span class="meta-cell" title="${escapeHtml(metaStr)}">${metaStr ? metaStr.substring(0, 30) + '...' : '-'}</span></td>
    </tr>`;
  }

  html += `</tbody></table>
    <div style="padding:12px 16px;font-size:13px;color:var(--text2);border-top:1px solid var(--border);">
      共 ${films.length} 条记录
    </div>`;

  container.innerHTML = html;
}

// ============================================================
// 设备表格渲染
// ============================================================

function renderGearTable(gearList) {
  const container = document.getElementById('tableContainer');

  if (!gearList || gearList.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📷</div>
        <p>还没有设备记录<br>去 <a href="/" style="color:var(--primary)">对话页面</a> 录入吧</p>
      </div>`;
    return;
  }

  let html = `<table>
    <thead><tr>
      <th onclick="sortBy('name')">名称 ${getSortIcon('name')}</th>
      <th>类型</th>
      <th>品牌</th>
      <th>型号</th>
      <th onclick="sortBy('status')">状态 ${getSortIcon('status')}</th>
      <th>成色</th>
      <th onclick="sortBy('price')">价格 ${getSortIcon('price')}</th>
      <th onclick="sortBy('purchase_date')">购买日期 ${getSortIcon('purchase_date')}</th>
      <th>存放</th>
      <th>备注</th>
    </tr></thead>
    <tbody>`;

  for (const g of gearList) {
    const statusBadge = getGearStatusBadge(g.status);
    const metaStr = g.meta ? Object.entries(g.meta).map(([k,v]) => {
      if (typeof v === 'object') return `${k}: ${JSON.stringify(v).substring(0,20)}`;
      return `${k}: ${v}`;
    }).join(', ') : '';

    html += `<tr>
      <td><strong>${escapeHtml(g.name)}</strong></td>
      <td>${escapeHtml(g.gear_type)}</td>
      <td>${escapeHtml(g.brand || '-')}</td>
      <td>${escapeHtml(g.model || '-')}</td>
      <td>${statusBadge}</td>
      <td>${g.condition || '-'}</td>
      <td>${g.price ? `¥${g.price}` : '-'}</td>
      <td>${g.purchase_date || '-'}</td>
      <td>${escapeHtml(g.storage_location || '-')}</td>
      <td><span class="meta-cell" title="${escapeHtml(metaStr)}">${metaStr ? metaStr.substring(0, 25) + '...' : '-'}</span></td>
    </tr>`;
  }

  html += `</tbody></table>
    <div style="padding:12px 16px;font-size:13px;color:var(--text2);border-top:1px solid var(--border);">
      共 ${gearList.length} 件设备
    </div>`;

  container.innerHTML = html;
}

// ============================================================
// 辅助函数
// ============================================================

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getFilmStatusBadge(status) {
  const map = {
    '未使用': '<span class="badge badge-ok">📦 未使用</span>',
    '已拍摄': '<span class="badge badge-shooting">📸 已拍摄</span>',
    '已冲洗': '<span class="badge badge-warning">🧪 已冲洗</span>',
    '已扫描': '<span class="badge badge-ok">🖥️ 已扫描</span>',
    '已使用': '<span class="badge badge-inactive">✅ 已使用</span>',
  };
  return map[status] || `<span class="badge badge-inactive">${status}</span>`;
}

function getGearStatusBadge(status) {
  const map = {
    '在用': '<span class="badge badge-ok">🟢 在用</span>',
    '闲置': '<span class="badge badge-warning">🟡 闲置</span>',
    '待出': '<span class="badge badge-shooting">📤 待出</span>',
    '已出': '<span class="badge badge-inactive">🚫 已出</span>',
    '维修中': '<span class="badge badge-expired">🔧 维修中</span>',
  };
  return map[status] || `<span class="badge badge-inactive">${status}</span>`;
}

function getExpiryBadge(status, daysLeft) {
  if (status === 'expired') {
    return `<span class="expiry-label danger">🔴 已过期 ${Math.abs(daysLeft)} 天</span>`;
  }
  if (status === 'expiring') {
    return `<span class="expiry-label warning">🟡 还剩 ${daysLeft} 天</span>`;
  }
  return `<span class="expiry-label" style="color:var(--text2)">${daysLeft !== undefined ? `${daysLeft} 天` : ''}</span>`;
}

function getSortIcon(field) {
  if (currentSort.field !== field) return '↕';
  return currentSort.dir === 'ASC' ? '↑' : '↓';
}

function sortBy(field) {
  if (currentSort.field === field) {
    currentSort.dir = currentSort.dir === 'ASC' ? 'DESC' : 'ASC';
  } else {
    currentSort.field = field;
    currentSort.dir = 'DESC';
  }
  loadData();
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab')[tab === 'film' ? 0 : 1].classList.add('active');

  const statusEl = document.getElementById('statusFilter');

// ============================================================
// Auth 模块（精简版 — 仅 Token + fetch 拦截）
// ============================================================

const Auth = {
  init() {
    this._patchFetch();
    if (!localStorage.getItem('access_token')) {
      window.location.href = '/';  // 未登录，跳回主页（会弹出登录框）
      return false;
    }
    this._updateUI();
    return true;
  },
  _updateUI() {
    const user = JSON.parse(localStorage.getItem('user') || '{}');
    const el = document.getElementById('userInfo');
    if (el && user.username) {
      el.innerHTML = `<span style="font-size:13px;color:var(--text2)">👤 ${user.username}</span>`;
    }
  },
  switchMode(mode) {
    const isLogin = mode === 'login';
    document.getElementById('loginForm').style.display = isLogin ? '' : 'none';
    document.getElementById('registerForm').style.display = isLogin ? 'none' : '';
    document.getElementById('authModalTitle').textContent = isLogin ? '登录' : '注册';
    document.getElementById('authError').textContent = '';
  },
  open(mode) {
    document.getElementById('authModal').classList.add('show');
    document.getElementById('authOverlay').classList.add('show');
    this.switchMode(mode || 'login');
  },
  close() {
    document.getElementById('authModal').classList.remove('show');
    document.getElementById('authOverlay').classList.remove('show');
  },
  async login() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    document.getElementById('authError').textContent = '';
    if (!username || !password) { document.getElementById('authError').textContent = '请输入用户名和密码'; return; }
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (data.status !== 'ok') { document.getElementById('authError').textContent = data.detail || '登录失败'; return; }
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('refresh_token', data.refresh_token);
      localStorage.setItem('user', JSON.stringify(data.user));
      this.close();
      this._updateUI();
      loadStats();
      loadData();
    } catch (err) { document.getElementById('authError').textContent = '网络错误，请重试'; }
  },
  async register() {
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm = document.getElementById('regConfirm').value;
    document.getElementById('authError').textContent = '';
    if (!username || !password) { document.getElementById('authError').textContent = '请输入用户名和密码'; return; }
    if (password.length < 6) { document.getElementById('authError').textContent = '密码至少6位'; return; }
    if (password !== confirm) { document.getElementById('authError').textContent = '两次密码不一致'; return; }
    try {
      const res = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (data.status !== 'ok') { document.getElementById('authError').textContent = data.detail || '注册失败'; return; }
      localStorage.setItem('access_token', data.access_token);
      localStorage.setItem('refresh_token', data.refresh_token);
      localStorage.setItem('user', JSON.stringify(data.user));
      this.close();
      this._updateUI();
      loadStats();
      loadData();
    } catch (err) { document.getElementById('authError').textContent = '网络错误，请重试'; }
  },
  _refreshing: null,
  async _ensureToken() {
    const token = localStorage.getItem('access_token');
    if (!token) { window.location.href = '/'; return null; }
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      if (payload.exp * 1000 > Date.now() + 60000) return token;
    } catch (e) {}
    if (!this._refreshing) {
      this._refreshing = (async () => {
        const rt = localStorage.getItem('refresh_token');
        if (!rt) throw new Error('no_rt');
        const res = await fetch('/api/auth/refresh', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: rt }),
        });
        if (!res.ok) throw new Error('refresh_fail');
        const data = await res.json();
        localStorage.setItem('access_token', data.access_token);
      })();
    }
    try { await this._refreshing; }
    finally { this._refreshing = null; }
    return localStorage.getItem('access_token');
  },
  _patchFetch() {
    const _orig = window.fetch;
    const self = this;
    window.fetch = async function(url, opts = {}) {
      const urlStr = (typeof url === 'string' ? url : url.url) || '';
      if (urlStr.includes('/api/auth/')) return _orig.call(window, url, opts);
      opts = opts || {}; opts.headers = opts.headers || {};
      try {
        const token = await self._ensureToken();
        if (token) opts.headers = { ...opts.headers, 'Authorization': 'Bearer ' + token };
      } catch (e) {}
      const res = await _orig.call(window, url, opts);
      if (res.status === 401) {
        localStorage.clear();
        window.location.href = '/';
      }
      return res;
    };
  },
};

// ============================================================
// 初始化
// ============================================================

if (Auth.init()) {
  loadStats();
  loadData();
}
